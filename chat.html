<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Campally - Chat</title>
  <link rel="stylesheet" href="style.css?v=20261015_02">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100dvh; margin: 0; padding: 0 !important; background: #FDF6EE; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #EEE7DD; flex-shrink: 0; }
    .chat-back { color: #2B2B2B; font-size: 17px; text-decoration: none; padding: 6px 8px; background: none; border: none; cursor: pointer; }
    .chat-who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: inherit; }
    .chat-av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #FDE8E3; color: #E8553D; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
    .chat-av img { width: 100%; height: 100%; object-fit: cover; }
    .chat-name { font-size: 15px; font-weight: 800; color: #1E1B4B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-name i { color: #059669; font-size: 12px; margin-left: 4px; }
    .chat-sub { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #F3F0EA; color: #444; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
    .chat-icon-btn.wa { background: #E8F8EE; color: #22A55B; }
    .chat-safety { background: #FFFBEB; border-bottom: 1px solid #FDE68A; color: #92400E; font-size: 12px; line-height: 1.45; padding: 8px 14px; display: flex; gap: 8px; align-items: flex-start; flex-shrink: 0; }
    .chat-safety button { margin-left: auto; background: none; border: none; color: #92400E; font-size: 16px; cursor: pointer; padding: 0 2px; }
    #thread { flex: 1; overflow-y: auto; padding: 14px 12px 8px 12px; -webkit-overflow-scrolling: touch; }
    .day-sep { text-align: center; margin: 12px 0 8px 0; }
    .day-sep span { background: #EFE9DF; color: #6B7280; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
    .msg-row { display: flex; margin-bottom: 6px; }
    .msg-row.mine { justify-content: flex-end; }
    .bubble { max-width: 80%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .mine .bubble { background: #E8553D; color: #fff; border-bottom-right-radius: 4px; }
    .theirs .bubble { background: #fff; color: #2B2B2B; border: 1px solid #EEE7DD; border-bottom-left-radius: 4px; }
    .bubble .meta { display: block; font-size: 10px; opacity: .75; margin-top: 3px; text-align: right; }
    .chat-listing { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.95); border: 1px solid #EEE7DD; color: #2B2B2B; border-radius: 10px; padding: 6px; margin-bottom: 6px; text-decoration: none; white-space: normal; }
    .chat-listing img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: #F0EDE6; }
    .chat-listing b { display: block; font-size: 12px; line-height: 1.3; }
    .chat-listing span { font-size: 12px; color: #E8553D; font-weight: 800; }
    .chat-empty { text-align: center; color: #94A3B8; font-size: 13px; padding: 50px 24px; line-height: 1.6; }
    .chat-compose { background: #fff; border-top: 1px solid #EEE7DD; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) 10px; flex-shrink: 0; }
    .compose-chip { display: flex; align-items: center; gap: 8px; background: #FFF5F3; border: 1px solid #FCD8D0; border-radius: 10px; padding: 6px 8px; margin-bottom: 8px; font-size: 12px; }
    .compose-chip img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
    .compose-chip div { flex: 1; min-width: 0; }
    .compose-chip b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1E1B4B; }
    .compose-chip button { background: none; border: none; font-size: 18px; color: #777; cursor: pointer; }
    .compose-row { display: flex; align-items: flex-end; gap: 8px; }
    #chat-input { flex: 1; resize: none; border: 1px solid #E5E0D8; border-radius: 20px; padding: 10px 14px; font-size: 15px; font-family: inherit; line-height: 1.35; max-height: 110px; background: #FDFBF8; outline: none; }
    #chat-input:focus { border-color: #E8553D; }
    #send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #E8553D; color: #fff; font-size: 17px; cursor: pointer; flex-shrink: 0; }
    #send-btn:disabled { background: #E5C4BC; }
    .blocked-bar { text-align: center; padding: 14px; font-size: 13px; color: #6B7280; }
    .blocked-bar button { margin-left: 8px; background: #E8553D; color: #fff; border: none; border-radius: 10px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
    .sheet { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 9000; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-panel { background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px; }
    .sheet-panel button, .sheet-panel a { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; text-align: left; font-size: 15px; padding: 14px 6px; border-bottom: 1px solid #F3F0EA; color: #2B2B2B; cursor: pointer; text-decoration: none; font-family: inherit; }
    .sheet-panel .danger { color: #DC2626; }
    .sheet-panel i { width: 20px; text-align: center; }
  </style>
</head>
<body>

  <header class="chat-head">
    <button type="button" class="chat-back" id="back-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <a class="chat-who" id="who-link" href="#">
      <div class="chat-av" id="who-av"></div>
      <div style="min-width:0;">
        <div class="chat-name" id="who-name">Loading...</div>
        <div class="chat-sub" id="who-sub"></div>
      </div>
    </a>
    <a class="chat-icon-btn wa" id="wa-btn" href="#" target="_blank" rel="noopener" style="display:none;" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    <button type="button" class="chat-icon-btn" id="menu-btn" aria-label="More options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </header>

  <div class="chat-safety" id="safety-bar">
    <i class="fa-solid fa-shield-halved" style="margin-top:2px;"></i>
    <span>Stay safe: meet in public campus spots, check the item first, and never send money or codes before you see it.</span>
    <button type="button" id="safety-close" aria-label="Dismiss">&times;</button>
  </div>

  <div id="thread"><div class="chat-empty">Loading chat...</div></div>

  <div class="chat-compose" id="compose">
    <div id="compose-chip-host"></div>
    <div class="compose-row">
      <textarea id="chat-input" rows="1" maxlength="1000" placeholder="Type a message"></textarea>
      <button type="button" id="send-btn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
  <div class="chat-compose" id="blocked-host" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-init.js"></script>
  <script src="chat.js?v=20261031"></script>
  <script src="nav.js?v=20261015_02"></script>
</body>
</html>

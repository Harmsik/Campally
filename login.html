<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally - Log In</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body class ="auth-body">

  <div class="auth-container">
    <h1 class="logo">Campally</h1>
    <p class="tagline">Welcome back</p>

    <form id="login-form" class="auth-form">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <p class="switch-text">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally - Log In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h1 class="logo">Campally</h1>
    <p class="tagline">Welcome back</p>

    <form id="login-form" class="auth-form">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; margin-bottom:6px;">
        <label style="margin:0;">Password</label>
        <a href="reset-password.html" style="font-size:13px; color:#E8553D; text-decoration:none; font-weight:600;">Forgot password?</a>
      </div>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit" id="login-submit-btn" class="btn-primary">Log In</button>
    </form>

    <p class="switch-text">Don't have an account? <a href="signup.html">Sign up</a></p>

    <div style="text-align:center; margin-top:16px; padding-top:14px; border-top:1px solid #E5E0D8;">
      <a href="home.html?visitor=true" id="browse-visitor-link" style="font-size:13px; color:#555; text-decoration:none; font-weight:500;">
        <i class="fa-solid fa-compass" style="color:#E8553D; margin-right:6px;"></i>Browse Marketplace as Visitor
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="nav.js"></script>
  <script src="login.js"></script>
</body>
</html>

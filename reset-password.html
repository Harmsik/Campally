<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally - Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h1 class="logo">Campally</h1>
    <p class="tagline">Reset your password</p>

    <form id="reset-form" class="auth-form">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <p class="switch-text"><a href="login.html">Back to Log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>

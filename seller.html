<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally - Seller Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header class="top-bar" style="justify-content:space-between;">
    <h1 class="logo-small">Profile</h1>
    <a href="settings.html" style="color:#444; text-decoration:none; font-size:18px;"><i class="fa-solid fa-gear"></i></a>
  </header>

  <div class="profile-card">
    <img id="seller-avatar" class="profile-avatar" src="" alt="">
<h2 id="seller-name">Loading...</h2>
<p id="seller-department" class="tagline"></p>
<p id="seller-hall" class="tagline"></p>

<div id="follow-section"></div>
<div id="profile-action"></div>
</div>
  <div style="padding: 0 20px; margin-top: 10px;">
    <h3 style="font-size:15px; margin-bottom:10px;">Listings</h3>
  </div>
  
  <div id="seller-listings" class="listings-grid">
  <p id="loading-text">Loading listings...</p>
</div>

<div style="padding: 0 20px; margin-top: 20px;">
  <h3 style="font-size:15px; margin-bottom:10px;">Reviews</h3>
  <div id="review-form-container"></div>
  <div id="reviews-list"></div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="seller.js"></script>
  <script src="nav.js"></script>
  <script>loadNav("profile");</script>
</body>
</html>

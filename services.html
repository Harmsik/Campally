<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service | Campally</title>
  <meta name="description" content="Book barbers, make-up artists, bakers, tutors and more from students on your campus.">
  <link rel="stylesheet" href="style.css?v=20261015_02">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .svc-wrap { padding: 0 20px 110px 20px; }
    .svc-sub { color:#666; font-size:13px; margin:12px 0 10px; line-height:1.5; }
    .svc-search { width:100%; padding:12px 14px; border:1px solid #E5E0D8; border-radius:12px; font-size:14px; background:#fff; box-sizing:border-box; }
    .svc-campus { font-size:12px; color:#777; margin:10px 0 0; }
    .svc-campus a { color:#E8553D; font-weight:600; cursor:pointer; }
    .svc-grid { display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
    .svc-card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    .svc-img { width:100%; height:140px; background:#F0EDE6; display:flex; align-items:center; justify-content:center; color:#B0AAA0; font-size:34px; object-fit:cover; }
    .svc-body { padding:12px 14px 14px; }
    .svc-tag { display:inline-block; background:#FDF1EE; color:#9C2A18; font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; }
    .svc-title { font-size:15px; font-weight:700; margin:8px 0 2px; color:#2B2B2B; }
    .svc-by { font-size:12px; color:#777; margin-bottom:6px; }
    .svc-desc { font-size:13px; color:#555; line-height:1.45; margin-bottom:8px; }
    .svc-price { font-size:14px; font-weight:700; color:#1E1B4B; margin-bottom:10px; }
    .svc-actions { display:flex; gap:8px; }
    .svc-book { flex:1; background:#E8553D; color:#fff; border:0; border-radius:12px; padding:11px; font-weight:700; font-size:14px; cursor:pointer; }
    .svc-view { background:#fff; color:#444; border:1px solid #E5E0D8; border-radius:12px; padding:11px 14px; font-weight:600; font-size:13px; text-decoration:none; }
    .svc-empty { text-align:center; color:#888; padding:40px 10px; font-size:14px; line-height:1.6; }
    .svc-empty a { color:#E8553D; font-weight:700; }
    .svc-modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:999; }
    .svc-sheet { background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:20px 20px 28px; box-sizing:border-box; }
    .svc-sheet h3 { margin:0 0 4px; font-size:17px; }
    .svc-sheet p { margin:0 0 12px; font-size:12px; color:#777; }
    .svc-sheet label { display:block; font-size:12px; font-weight:700; margin:10px 0 4px; color:#444; }
    .svc-sheet input, .svc-sheet textarea { width:100%; padding:11px 12px; border:1px solid #E5E0D8; border-radius:10px; font-size:14px; box-sizing:border-box; font-family:inherit; }
    .svc-send { width:100%; margin-top:14px; background:#25D366; color:#fff; border:0; border-radius:12px; padding:13px; font-weight:700; font-size:15px; cursor:pointer; }
    .svc-cancel { width:100%; margin-top:8px; background:none; border:0; color:#777; font-size:13px; padding:8px; cursor:pointer; }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1 class="logo-small">Book a Service</h1>
  </header>

  <div class="svc-wrap">
    <p class="svc-sub">Barbers, make-up artists, bakers, tutors and more, from students on your campus. Pick one, tell them when you need it, and book on WhatsApp.</p>
    <input id="svc-search" class="svc-search" type="search" placeholder="Search services (e.g. braids, cake, laptop repair)">
    <div id="svc-campus" class="svc-campus"></div>
  </div>

  <div id="svc-chips" class="category-chips-bar"></div>

  <div class="svc-wrap">
    <div id="svc-grid" class="svc-grid"></div>
  </div>

  <div id="svc-modal" class="svc-modal">
    <div class="svc-sheet">
      <h3 id="svc-modal-title">Book</h3>
      <p id="svc-modal-by"></p>
      <label for="svc-when">When do you need it?</label>
      <input id="svc-when" type="text" placeholder="e.g. Saturday 4pm">
      <label for="svc-where">Where? (your hostel or location)</label>
      <input id="svc-where" type="text" placeholder="e.g. Silver Hostel, Room 12">
      <label for="svc-note">Anything else? (optional)</label>
      <textarea id="svc-note" rows="2" placeholder="e.g. Low cut with a fade"></textarea>
      <button id="svc-send" class="svc-send"><i class="fa-brands fa-whatsapp"></i> Send booking request on WhatsApp</button>
      <button id="svc-cancel" class="svc-cancel">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-init.js"></script>
  <script src="nav.js"></script>
  <script src="services.js"></script>
  <script>loadNav("services");</script>
</body>
</html>

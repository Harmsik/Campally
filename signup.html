<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally</title>
  <link rel="stylesheet" href="style.css?v=20261015_02">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div id="ambassador-referral-banner" style="display:none; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:12px; padding:12px 14px; margin-bottom:16px; text-align:left;">
      <div id="ambassador-banner-title" style="font-size:13px; font-weight:700; color:#1E40AF;"></div>
      <div id="ambassador-banner-desc" style="font-size:12px; color:#3B82F6; margin-top:2px;"></div>
    </div>

    <h1 class="logo">Campally</h1>
    <p class="tagline">Your campus, your marketplace</p>

    <button type="button" id="google-btn" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="google-note">By continuing you agree to our <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.</p>
    <div class="or-divider"><span>or use your email</span></div>

    <form id="signup-form" class="auth-form">
      <label>Full Name</label>
      <input type="text" id="full-name" placeholder="e.g. Ada Obi" required>

      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required>

      <div style="display:flex; align-items:flex-start; gap:8px; margin-top:14px; margin-bottom:4px; font-size:12px; color:#555;">
        <input type="checkbox" id="privacy-consent" required style="margin-top:2px;">
        <label for="privacy-consent" style="margin:0; font-size:12px; font-weight:400; color:#555;">
          I agree to the <a href="privacy-policy.html" target="_blank" style="color:#E8553D; text-decoration:none; font-weight:600;">Privacy Policy</a> and terms.
        </label>
      </div>

      <div style="display:flex; align-items:flex-start; gap:8px; margin-top:8px; margin-bottom:4px; font-size:12px; color:#555;">
        <input type="checkbox" id="marketing-consent" style="margin-top:2px;">
        <label for="marketing-consent" style="margin:0; font-size:12px; font-weight:400; color:#555;">
          (Optional) Send me occasional Campally updates by email. I can unsubscribe anytime.
        </label>
      </div>

      <button type="submit" id="signup-submit-btn" class="btn-primary">Sign Up</button>
    </form>

    <p class="switch-text">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-init.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
  <script src="google-config.js?v=20261102"></script>
  <script src="google-auth.js?v=20261102"></script>
</body>
</html>

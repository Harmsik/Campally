<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally</title>
  <link rel="stylesheet" href="style.css?v=20261015_02">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .acct-choose { display:flex; gap:10px; margin:6px 0 14px 0; }
    .acct-opt { flex:1; cursor:pointer; }
    .acct-opt input { position:absolute; opacity:0; pointer-events:none; }
    .acct-opt span { display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center; padding:12px 8px; border:1.5px solid #E5E0D8; border-radius:14px; background:#fff; font-size:13px; color:#1E1B4B; }
    .acct-opt span i { font-size:18px; color:#E8553D; }
    .acct-opt span small { font-size:11px; color:#6B7280; line-height:1.3; }
    .acct-opt input:checked + span { border-color:#E8553D; background:#FFF5F3; box-shadow:0 2px 8px rgba(232,85,61,.15); }
    #vendor-note { display:none; font-size:12px; color:#92400E; background:#FFFBEB; border:1px solid #FDE68A; border-radius:12px; padding:10px 12px; margin:0 0 12px 0; line-height:1.5; text-align:left; }
  </style>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div id="ambassador-referral-banner" style="display:none; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:12px; padding:12px 14px; margin-bottom:16px; text-align:left;">
      <div id="ambassador-banner-title" style="font-size:13px; font-weight:700; color:#1E40AF;"></div>
      <div id="ambassador-banner-desc" style="font-size:12px; color:#3B82F6; margin-top:2px;"></div>
    </div>

    <h1 class="logo">Campally</h1>
    <p class="tagline">Your campus, your marketplace</p>

    <div class="acct-choose" id="acct-choose">
      <label class="acct-opt"><input type="radio" name="account-type" value="student" checked><span><i class="fa-solid fa-graduation-cap"></i><b>I'm a student</b><small>Buy, sell and swap on campus</small></span></label>
      <label class="acct-opt"><input type="radio" name="account-type" value="vendor"><span><i class="fa-solid fa-store"></i><b>I'm a campus vendor</b><small>I sell to students</small></span></label>
    </div>
    <p id="vendor-note"><i class="fa-solid fa-shield-halved"></i> Vendors sign up with email and are checked with a government ID before they can post. Google sign-in is for students.</p>

    <div id="google-block">
    <button type="button" id="google-btn" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="google-note">By continuing you agree to our <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.</p>
    <div class="or-divider"><span>or use your email</span></div>
    </div>

    <form id="signup-form" class="auth-form">
      <label>Full Name</label>
      <input type="text" id="full-name" placeholder="e.g. Ada Obi" required>

      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required>

      <div style="display:flex; align-items:flex-start; gap:8px; margin-top:14px; margin-bottom:4px; font-size:12px; color:#555;">
        <input type="checkbox" id="privacy-consent" required style="margin-top:2px;">
        <label for="privacy-consent" style="margin:0; font-size:12px; font-weight:400; color:#555;">
          I agree to the <a href="terms.html" target="_blank" style="color:#E8553D; text-decoration:none; font-weight:600;">Terms of Service</a> and <a href="privacy-policy.html" target="_blank" style="color:#E8553D; text-decoration:none; font-weight:600;">Privacy Policy</a>.
        </label>
      </div>

      <div style="display:flex; align-items:flex-start; gap:8px; margin-top:8px; margin-bottom:4px; font-size:12px; color:#555;">
        <input type="checkbox" id="marketing-consent" style="margin-top:2px;">
        <label for="marketing-consent" style="margin:0; font-size:12px; font-weight:400; color:#555;">
          (Optional) Send me occasional Campally updates by email. I can unsubscribe anytime.
        </label>
      </div>

      <button type="submit" id="signup-submit-btn" class="btn-primary">Sign Up</button>
    </form>

    <p class="switch-text">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-init.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
  <script src="google-config.js?v=20261102"></script>
  <script src="google-auth.js?v=20261102"></script>
  <script>
    (function () {
      var g = document.getElementById("google-block");
      var n = document.getElementById("vendor-note");
      var b = document.getElementById("signup-submit-btn");
      function current() { var r = document.querySelector('input[name="account-type"]:checked'); return r ? r.value : "student"; }
      function sync() {
        var v = current() === "vendor";
        if (g) g.style.display = v ? "none" : "";
        if (n) n.style.display = v ? "block" : "none";
        if (b && !b.disabled) b.textContent = v ? "Sign up as a vendor" : "Sign Up";
      }
      try { if (new URLSearchParams(location.search).get("type") === "vendor") document.querySelector('input[name="account-type"][value="vendor"]').checked = true; } catch (e) {}
      document.querySelectorAll('input[name="account-type"]').forEach(function (r) { r.addEventListener("change", sync); });
      sync();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campally - New Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h1 class="logo">Campally</h1>
    <p class="tagline">Set a new password</p>

    <form id="update-form" class="auth-form">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="At least 6 characters" required>

      <button type="submit" class="btn-primary">Update Password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="update-password.js"></script>
</body>
  </html>

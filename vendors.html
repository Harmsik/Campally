<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Campally">
  <meta property="og:title" content="Campally - Your campus marketplace">
  <meta property="og:description" content="Buy, sell and swap with verified students, and find shops and vendors near your campus. Free to join.">
  <meta property="og:image" content="https://campally.com.ng/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Campally - Your campus marketplace">
  <meta name="twitter:description" content="Buy, sell and swap with verified students, and find shops and vendors near your campus. Free to join.">
  <meta name="twitter:image" content="https://campally.com.ng/og-image.png">
  <title>Campus Vendors | Campally</title>
  <meta name="description" content="Verified shops and vendors near your campus. Find food, provisions, printing, laundry and more.">
  <link rel="stylesheet" href="style.css?v=20261015_02">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .vd-wrap { padding: 0 20px 110px 20px; }
    .vd-sub { color:#666; font-size:13px; margin:12px 0 10px; line-height:1.5; }
    .vd-search { width:100%; padding:12px 14px; border:1px solid #E5E0D8; border-radius:12px; font-size:14px; background:#fff; box-sizing:border-box; }
    .vd-campus { font-size:12px; color:#777; margin:10px 0 0; }
    .vd-campus a { color:#E8553D; font-weight:700; cursor:pointer; }
    .vd-list { display:flex; flex-direction:column; gap:12px; margin-top:14px; }
    .vd-card { display:flex; gap:12px; background:#fff; border:1px solid #EEE7DD; border-radius:16px; padding:12px; text-decoration:none; box-shadow:0 2px 10px rgba(30,27,75,.05); }
    .vd-logo { width:56px; height:56px; border-radius:50%; object-fit:cover; background:#FEF3C7; flex-shrink:0; }
    .vd-logo-fallback { width:56px; height:56px; border-radius:50%; background:#FEF3C7; color:#B45309; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .vd-info { min-width:0; flex:1; }
    .vd-name { font-size:15px; font-weight:800; color:#1E1B4B; }
    .vd-pill { display:inline-block; background:#FFF7D6; color:#8A5A00; border:1px solid #F5C451; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; margin-top:3px; }
    .vd-line { font-size:12px; color:#64748B; margin-top:4px; line-height:1.45; }
    .vd-about { font-size:12.5px; color:#475569; margin-top:5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .vd-tag { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; margin:3px 4px 0 0; }
    .vd-empty { text-align:center; color:#888; padding:40px 10px; font-size:14px; line-height:1.6; }
    .vd-empty a { color:#E8553D; font-weight:700; }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1 class="logo-small">Campus Vendors</h1>
  </header>
  <script src="page-shell.js" data-skeleton="list"></script>

  <div class="vd-wrap">
    <p class="vd-sub">Verified shops and vendors near campus. Tap one to see their products, opening hours and where they deliver.</p>
    <input id="vd-search" class="vd-search" type="search" placeholder="Search shop, area or hostel (e.g. Silver Hostel)">
    <div id="vd-campus" class="vd-campus"></div>
  </div>

  <div id="vd-cats" class="category-chips-bar" style="margin-top:10px;"></div>
  <div id="vd-toggles" class="category-chips-bar">
    <button type="button" class="category-chip" id="vd-open-chip">● Open now</button>
    <button type="button" class="category-chip" id="vd-hostel-chip"><i class="fa-solid fa-motorcycle"></i> Delivers to my hostel</button>
  </div>
  <div class="vd-wrap" style="padding-top:0;">
    <div id="vd-note" class="vd-campus" style="display:none; color:#92400E;"></div>
    <div id="vd-list" class="vd-list"><p class="vd-empty">Loading vendors...</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <script src="supabase-init.js"></script>
  <script src="campuses.js"></script>
  <script src="nav.js"></script>
  <script src="vendors.js"></script>
  <script>loadNav("home");</script>
</body>
</html>
